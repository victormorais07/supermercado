<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel - Mercado Vila Nova</title>
  <link rel="icon" href="/imagens/logo.svg">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <a href="index.html" class="marca"><img src="/imagens/logo.svg" alt=""> Mercado Vila Nova</a>
    <nav>
      <a href="index.html" class="ativo">Painel</a>
      <a href="caixa.html">Caixa</a>
      <a href="produtos.html">Produtos</a>
      <a href="categorias.html">Categorias</a>
      <a href="vendas.html">Vendas</a>
    </nav>
  </header>

  <main class="conteudo">
    <div class="titulo-pagina">
      <h1>Painel</h1>
      <span class="info" id="dataHoje"></span>
    </div>

    <section class="cards">
      <div class="card">
        <span>Vendas hoje</span>
        <strong id="vendasHoje">-</strong>
      </div>
      <div class="card">
        <span>Faturamento hoje</span>
        <strong id="faturamentoHoje">-</strong>
      </div>
      <div class="card">
        <span>Faturamento do mês</span>
        <strong id="faturamentoMes">-</strong>
      </div>
      <div class="card">
        <span>Ticket médio (mês)</span>
        <strong id="ticketMedio">-</strong>
      </div>
      <div class="card">
        <span>Produtos cadastrados</span>
        <strong id="totalProdutos">-</strong>
      </div>
      <div class="card alerta">
        <span>Com estoque baixo</span>
        <strong id="qtdEstoqueBaixo">-</strong>
      </div>
    </section>

    <section class="painel-grid">
      <div class="caixa-branca largo">
        <h2>Vendas dos últimos 7 dias</h2>
        <div class="grafico" id="grafico"></div>
      </div>

      <div class="caixa-branca">
        <h2>Estoque baixo</h2>
        <div class="rolagem">
          <table class="tabela compacta">
            <thead>
              <tr><th>Produto</th><th class="direita">Atual</th><th class="direita">Mínimo</th></tr>
            </thead>
            <tbody id="tabelaEstoqueBaixo"></tbody>
          </table>
        </div>
      </div>

      <div class="caixa-branca">
        <h2>Mais vendidos</h2>
        <table class="tabela compacta">
          <thead>
            <tr><th>Produto</th><th class="direita">Qtd</th><th class="direita">Total</th></tr>
          </thead>
          <tbody id="tabelaMaisVendidos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
