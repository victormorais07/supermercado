<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contas - Mercado Vila Nova</title>
  <link rel="icon" href="/imagens/logo.svg">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <a href="index.html" class="marca"><img src="/imagens/logo.svg" alt=""> Mercado Vila Nova</a>
    <nav>
      <a href="index.html">Painel</a>
      <a href="caixa.html">Caixa</a>
      <a href="produtos.html">Produtos</a>
      <a href="categorias.html">Categorias</a>
      <a href="vendas.html">Vendas</a>
      <a href="contas.html" class="so-admin ativo">Contas</a>
    </nav>
  </header>

  <main class="conteudo" style="max-width: 900px">
    <div class="titulo-pagina">
      <h1>Contas de usuário</h1>
    </div>

    <form class="caixa-branca" id="formConta" novalidate style="margin-bottom: 18px">
      <h2>Nova conta</h2>
      <p class="erro-form"></p>
      <div class="form-grid colunas-4">
        <label>Nome <input name="nome" maxlength="60"></label>
        <label>Usuário <input name="usuario" maxlength="20" autocapitalize="none"></label>
        <label>Senha <input name="senha" type="password" autocomplete="new-password"></label>
        <label>Perfil
          <select name="perfil">
            <option value="operador">Operador</option>
            <option value="admin">Administrador</option>
          </select>
        </label>
      </div>
      <button class="btn" type="submit">Criar conta</button>
    </form>

    <div class="caixa-branca rolagem">
      <table class="tabela">
        <thead>
          <tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Criado em</th><th></th></tr>
        </thead>
        <tbody id="tabelaContas"></tbody>
      </table>
    </div>
  </main>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/contas.js"></script>
</body>
</html>
